[project]
name = "marimo-pmprov"
version = "0.1.1"
description = "A marimo anywidget for analytic provenance and annotation, decoupled from pmprov."
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.9",
    "marimo>=0.9",
    "traitlets>=5.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pandas", "matplotlib", "altair", "vl-convert-python", "plotly"]
# For examples/provenance_demo-style notebooks that drive a real pmprov
# RuntimeTracker. pmprov itself isn't listed here — PyPI rejects direct VCS
# dependencies in published metadata (see git history) — install it
# separately per the README's "Connecting a real pmprov-backed history".
demo = ["networkx", "pydantic", "pyarrow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provenance_widget"]
