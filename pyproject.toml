[project]
name = "marimo-pmprov"
version = "0.2.1"
description = "A marimo anywidget for analytic provenance, annotation and replay on top of pmprov."
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.9",
    "marimo>=0.9",
    "traitlets>=5.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4", "pypdf", "pandas", "matplotlib", "altair", "vl-convert-python", "plotly"]
# pmprov is optional: the widget runs against a mock source without it.
# pmprov needs Python >= 3.13 and pins exact versions of marimo, pandas, etc.
pmprov = ["pmprov>=0.9; python_version >= '3.13'"]
# "Export PDF" in the analyst sidebar (ProvenancePanel.export_pdf). Embedding Plotly
# figures also needs kaleido.
pdf = ["reportlab>=4"]
# For examples/provenance_demo-style notebooks that drive a real pmprov
# RuntimeTracker.
demo = ["networkx", "pydantic", "pyarrow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provenance_widget"]

[tool.pytest.ini_options]
# The default run is the package's own tests. benchmarks/ and the pmprov
# acceptance test in docs/ need a specific pmprov; run them explicitly.
testpaths = ["tests"]
