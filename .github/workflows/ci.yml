name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Python, without pmprov (the widget runs against its mock source)
          - name: py3.11 without pmprov
            os: ubuntu-latest
            python: "3.11"
            extras: "--extra dev"
          # with pmprov, the way a hosted notebook (molab) runs it, and on Windows, where the package is developed
          - name: py3.13 with pmprov
            os: ubuntu-latest
            python: "3.13"
            extras: "--extra dev --extra pmprov"
          - name: py3.13 with pmprov, Windows
            os: windows-latest
            python: "3.13"
            extras: "--extra dev --extra pmprov"
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v7.0.1

      - name: Set up Python 🐍
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies 📦
        # --locked fails when uv.lock does not match pyproject.toml (a version bump that forgot the lock file)
        run: uv sync --locked ${{ matrix.extras }}

      - name: Run tests 🧪
        run: uv run pytest -rs

  frontend:
    name: frontend bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v7.0.1

      - name: Install the frontend's packages 📦
        working-directory: frontend
        run: npm ci

      - name: Type-check 🔎
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Rebuild the bundle 🏗️
        working-directory: frontend
        run: npm run build

      - name: The committed bundle is the one the source builds 🧾
        # provenance_widget/static/widget.js is what gets packaged; a source change without a rebuilt bundle would ship the old one
        run: git diff --exit-code -- provenance_widget/static

  build:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      already-published: ${{ steps.version-check.outputs.already-published }}
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v7.0.1

      - name: Set up Python 🐍
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v9.0.0

      - name: Check if version already published 🔍
        id: version-check
        run: |
          NAME=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['name'])")
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/$NAME/$VERSION/json)
          if [ "$STATUS" = "200" ]; then
            echo "already-published=true" >> $GITHUB_OUTPUT
          else
            echo "already-published=false" >> $GITHUB_OUTPUT
          fi

      - name: Build 🏗️
        if: steps.version-check.outputs.already-published == 'false'
        run: uv build

      - name: Upload dist artifacts 📤
        if: steps.version-check.outputs.already-published == 'false'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.already-published == 'false'
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts 📥
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v9.0.0

      - name: Publish to PyPI 🚀
        run: uv publish

